name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - develop

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Print toolchain versions
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        # Errors-only gate for now: the legacy app code still carries
        # warning/info-level lint debt (unused elements, deprecated_member_use,
        # use_build_context_synchronously, ...). TODO: burn it down, then drop
        # --no-fatal-warnings to re-tighten the gate.
        run: flutter analyze --no-fatal-warnings

      - name: Unit & widget tests
        run: flutter test --reporter expanded
