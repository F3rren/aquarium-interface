name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - develop

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pin to the project's toolchain (pubspec.lock records
          # flutter >=3.38.4 / dart >=3.10.3) for reproducible CI. Do NOT use
          # an unpinned `channel: stable`: Flutter 3.44+ made `IconData` a
          # final class, which breaks font_awesome_flutter 10.12.0 (it extends
          # IconData) at test-compile time. Bump font_awesome before raising
          # this pin past 3.43.
          flutter-version: 3.38.4
          channel: stable
          cache: true

      - name: Print toolchain versions
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        # Errors-only gate for now: `flutter analyze` treats BOTH infos and
        # warnings as fatal by default, and the legacy app code still carries
        # ~45 warning/info findings (unused elements, deprecated_member_use,
        # use_build_context_synchronously, ...). TODO: burn it down, then drop
        # these two flags to re-tighten the gate.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit & widget tests
        run: flutter test --reporter expanded
